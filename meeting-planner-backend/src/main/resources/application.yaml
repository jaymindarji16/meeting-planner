spring:
  application:
    name: meeting-planner-backend
  datasource:
    url: jdbc:h2:file:./data/meetingplanner
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080

app:
  upload:
    dir: ./uploads